baseURL: "https://www.blug.linux.no/"
title: "Bergen Linux User Group"
copyright: "&copy; 2017 BLUG"
enableEmoji: true
paginate: 10
defaultContentLanguage: en
defaultContentLanguageInSubdir: false
buildFuture: true

outputs:
  home:
    - HTML
    - RSS

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    style: github

security:
  # Replaces Hugo's default allow list rather than appending to it, so the
  # built-in entries are repeated here. Hugo v0.165.0 dropped ^tailwindcss$
  # from the defaults; css.TailwindCSS needs it to run.
  exec:
    allow:
      - ^(dart-)?sass$
      - ^go$
      - ^git$
      - ^node$
      - ^postcss$
      - ^tailwindcss$
  funcs:
    getenv:
      - ^HUGO_
      - ^WC_

build:
  writeStats: true
